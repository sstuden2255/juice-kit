name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated PR runs, but let every commit on main keep its own verdict:
  # "CI green on main" is the Phase 1 acceptance signal.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no later step pushes

      # pnpm/setup reads "packageManager": "pnpm@12.4.2" from package.json and downloads the
      # native binary. Do not also pass `version`. (pnpm/action-setup is for pnpm 10 and older.)
      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm # runs `pnpm store path`, so pnpm must already be installed

      - name: Install
        run: pnpm install --frozen-lockfile

      # Parses compose.yaml, its interpolation and its schema without pulling images.
      # Docker Compose v2 is preinstalled on ubuntu-latest.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate registry JSON
        run: pnpm validate:registry
